<!doctype html>
<html>
  <head>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060711;
      }

      [data-fd-composition] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        color: #fff;
        background:
          radial-gradient(900px 680px at 82% 22%, rgba(108, 92, 231, 0.24), transparent 64%),
          radial-gradient(760px 660px at 12% 76%, rgba(0, 210, 190, 0.14), transparent 68%),
          linear-gradient(155deg, #101626 0%, #070913 52%, #04050a 100%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }

      [data-fd-clip] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .ambient {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .orb {
        position: absolute;
        width: 680px;
        height: 680px;
        border-radius: 50%;
        filter: blur(85px);
        opacity: 0.22;
        will-change: transform;
      }

      .orb-a {
        top: -240px;
        right: -290px;
        background: #6c5ce7;
      }

      .orb-b {
        bottom: -340px;
        left: -300px;
        background: #00c6b2;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.16;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 7px 7px, 11px 11px;
        mix-blend-mode: soft-light;
      }

      .frame-mark {
        position: absolute;
        top: 72px;
        left: 70px;
        width: 96px;
        height: 18px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.48)) top left / 100% 3px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0.48)) top left / 3px 100% no-repeat;
      }

      .video-shot {
        display: grid;
        place-items: center;
      }

      .video-card {
        position: absolute;
        left: 48px;
        right: 48px;
        top: 642px;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 34px;
        background: #090b13;
        box-shadow:
          0 54px 130px rgba(0, 0, 0, 0.58),
          0 0 0 10px rgba(255, 255, 255, 0.025);
        transform-origin: center;
        will-change: transform, opacity;
      }

      .video-card canvas,
      .end-visual canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .bad-call .video-card {
        top: 660px;
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow:
          0 48px 110px rgba(0, 0, 0, 0.62),
          0 0 0 10px rgba(255, 255, 255, 0.02);
      }

      .bad-call canvas {
        filter: saturate(0.48) brightness(0.68) contrast(0.9);
      }

      .call-chrome {
        position: absolute;
        z-index: 2;
        inset: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 58px;
        padding: 0 22px;
        color: rgba(255, 255, 255, 0.68);
        background: linear-gradient(#171923, rgba(14, 16, 24, 0.88));
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.05em;
      }

      .window-dots {
        display: flex;
        gap: 9px;
      }

      .window-dots i {
        display: block;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }

      .call-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .call-label::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff5d78;
        box-shadow: 0 0 16px rgba(255, 93, 120, 0.8);
      }

      .news-shot .video-card {
        top: 584px;
        left: 30px;
        right: 30px;
        border-color: rgba(166, 149, 255, 0.55);
        border-radius: 42px;
        box-shadow:
          0 68px 150px rgba(0, 0, 0, 0.58),
          0 0 70px rgba(108, 92, 231, 0.2),
          0 0 0 10px rgba(143, 126, 255, 0.055);
      }

      .news-shot canvas {
        filter: saturate(1.06) contrast(1.02);
      }

      .studio-tag {
        position: absolute;
        z-index: 2;
        right: 22px;
        bottom: 20px;
        padding: 12px 17px 11px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(7, 9, 18, 0.64);
        backdrop-filter: blur(14px);
        font-size: 18px;
        font-weight: 760;
        letter-spacing: 0.09em;
      }

      .copy {
        z-index: 3;
        padding: 176px 70px 0;
        pointer-events: none;
      }

      .kicker {
        display: inline-flex;
        align-items: center;
        min-height: 52px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        color: #c8c1ff;
        background: rgba(255, 255, 255, 0.055);
        font-size: 26px;
        font-weight: 760;
        letter-spacing: 0.11em;
      }

      .hook-title,
      .reveal-title,
      .end-title {
        margin: 34px 0 0;
        font-weight: 860;
        letter-spacing: -0.055em;
        line-height: 0.92;
        text-wrap: balance;
      }

      .hook-title {
        max-width: 940px;
        font-size: 106px;
      }

      .hook-title .line-two {
        display: block;
        margin-top: 22px;
        color: #a9a6b3;
        font-size: 78px;
        letter-spacing: -0.045em;
      }

      .hook-copy::after {
        content: "ordinary remote video";
        position: absolute;
        left: 72px;
        top: 1320px;
        color: rgba(255, 255, 255, 0.34);
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .reveal-copy {
        padding-top: 152px;
      }

      .reveal-title {
        font-size: 118px;
      }

      .reveal-title .line-two {
        display: block;
        width: fit-content;
        margin-top: 12px;
        padding-right: 18px;
        color: transparent;
        background: linear-gradient(95deg, #fd79a8 0%, #b58cff 40%, #6c9dff 72%, #57ebdb 100%);
        background-clip: text;
        filter: drop-shadow(0 12px 38px rgba(108, 92, 231, 0.26));
      }

      .proof-chips {
        z-index: 3;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        padding: 0 54px 250px;
        pointer-events: none;
      }

      .proof-chip {
        display: flex;
        align-items: center;
        min-height: 62px;
        padding: 0 22px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.94);
        background: rgba(5, 7, 15, 0.68);
        box-shadow: 0 16px 52px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
        font-size: 23px;
        font-weight: 780;
        letter-spacing: 0.065em;
        white-space: nowrap;
      }

      .proof-chip::before {
        content: "";
        width: 10px;
        height: 10px;
        margin-right: 12px;
        border-radius: 50%;
        background: #66ead9;
        box-shadow: 0 0 22px rgba(102, 234, 217, 0.78);
      }

      .transition-flash {
        z-index: 6;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.98), rgba(179, 167, 255, 0.62) 24%, transparent 68%);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .end-visual {
        z-index: 1;
      }

      .end-visual canvas {
        object-position: 68% center;
        filter: blur(7px) brightness(0.34) saturate(1.2);
        transform: scale(1.09);
      }

      .end-visual::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(700px 600px at 72% 28%, rgba(108, 92, 231, 0.34), transparent 68%),
          linear-gradient(180deg, rgba(4, 5, 10, 0.42), rgba(4, 5, 10, 0.88));
      }

      .end-card {
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 76px;
        pointer-events: none;
      }

      .end-brand {
        width: fit-content;
        color: transparent;
        background: linear-gradient(95deg, #ff7ab0, #af7cff 35%, #6c9dff 68%, #57ebdb);
        background-clip: text;
        font-size: 70px;
        font-weight: 830;
        letter-spacing: -0.05em;
        filter: drop-shadow(0 8px 30px rgba(108, 92, 231, 0.28));
      }

      .end-title {
        margin-top: 66px;
        font-size: 112px;
      }

      .end-title .line-two {
        display: block;
        color: #b8acff;
      }

      .end-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 106px;
        padding-top: 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.22);
      }

      .end-cta {
        font-size: 25px;
        font-weight: 760;
        letter-spacing: 0.095em;
      }

      .end-url {
        color: #c8c1ff;
        font-size: 32px;
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <main
      data-fd-composition
      data-fd-id="CreatorSocial"
      data-fd-name="LightTwist · Creator social · 9:16"
      data-fd-width="1080"
      data-fd-height="1920"
      data-fd-fps="30"
      data-fd-duration="285"
      data-fd-kind="edit"
      data-fd-source="src/compositions/CreatorSocial.html"
      data-fd-module="src/compositions/CreatorSocial.ts"
      data-fd-export="creatorSocialComp"
      data-fd-timeline-source="src/compositions/CreatorSocial.timeline.json"
      data-fd-document="src/compositions/CreatorSocial.comp.json"
      data-fd-schema="src/compositions/CreatorSocial.schema.json"
      data-fd-render-from="0"
      data-fd-render-to="284"
    >
      <div class="ambient">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grain"></div>
        <div class="frame-mark"></div>
      </div>

      <section
        class="video-shot bad-call"
        data-fd-clip
        data-fd-id="bad-call"
        data-fd-name="Before · remote-call grid"
        data-fd-grade-saturation="0.6"
        data-fd-grade-contrast="-0.08"
        data-fd-grade-exposure="-0.08"
        data-fd-grade-vignette="0.28"
      >
        <div class="video-card">
          <div class="call-chrome">
            <span class="window-dots"><i></i><i></i><i></i></span>
            <span class="call-label">REMOTE RECORDING</span>
          </div>
          <canvas data-fd-grade-video></canvas>
        </div>
      </section>

      <section
        class="video-shot news-shot news-wide"
        data-fd-clip
        data-fd-id="news-wide"
        data-fd-name="After · LightTwist newsroom wide"
        data-fd-lut="gold"
        data-fd-lut-intensity="0.6"
        data-fd-grade-contrast="0.08"
        data-fd-grade-saturation="1.06"
        data-fd-grade-bloom="0.28"
        data-fd-grade-bloom-threshold="0.58"
        data-fd-grade-vignette="0.2"
      >
        <div class="video-card">
          <canvas data-fd-grade-video></canvas>
          <span class="studio-tag">LIVE IN LIGHTTWIST</span>
        </div>
      </section>

      <section
        class="video-shot news-shot news-mid"
        data-fd-clip
        data-fd-id="news-mid"
        data-fd-name="After · LightTwist newsroom medium"
        data-fd-lut="gold"
        data-fd-lut-intensity="0.58"
        data-fd-grade-contrast="0.08"
        data-fd-grade-saturation="1.06"
        data-fd-grade-bloom="0.24"
        data-fd-grade-vignette="0.2"
      >
        <div class="video-card">
          <canvas data-fd-grade-video></canvas>
          <span class="studio-tag">REMOTE GUESTS · TOGETHER</span>
        </div>
      </section>

      <section
        class="video-shot news-shot news-angle"
        data-fd-clip
        data-fd-id="news-angle"
        data-fd-name="After · LightTwist newsroom angle"
        data-fd-lut="gold"
        data-fd-lut-intensity="0.58"
        data-fd-grade-contrast="0.08"
        data-fd-grade-saturation="1.06"
        data-fd-grade-bloom="0.24"
        data-fd-grade-vignette="0.2"
      >
        <div class="video-card">
          <canvas data-fd-grade-video></canvas>
          <span class="studio-tag">YOUR SHOW · YOUR BRAND</span>
        </div>
      </section>

      <section class="copy hook-copy" data-fd-clip data-fd-id="hook-copy" data-fd-name="Hook copy">
        <div class="kicker" data-fd-id="hook-kicker"></div>
        <h1 class="hook-title">
          <span data-fd-id="hook-line-one"></span>
          <span class="line-two" data-fd-id="hook-line-two"></span>
        </h1>
      </section>

      <section class="copy reveal-copy" data-fd-clip data-fd-id="reveal-copy" data-fd-name="Transformation copy">
        <h2 class="reveal-title">
          <span data-fd-id="reveal-line-one"></span>
          <span class="line-two" data-fd-id="reveal-line-two"></span>
        </h2>
      </section>

      <section class="proof-chips" data-fd-clip data-fd-id="proof-chips" data-fd-name="Proof chips">
        <div class="proof-chip" data-fd-id="proof-chip-one"></div>
        <div class="proof-chip" data-fd-id="proof-chip-two"></div>
      </section>

      <section class="transition-flash" data-fd-clip data-fd-id="transition-flash" data-fd-name="Before/after flash"></section>

      <section
        class="end-visual"
        data-fd-clip
        data-fd-id="end-visual"
        data-fd-name="End card atmosphere"
        data-fd-lut="gold"
        data-fd-lut-intensity="0.52"
        data-fd-grade-saturation="1.08"
      >
        <canvas data-fd-grade-video></canvas>
      </section>

      <section class="end-card" data-fd-clip data-fd-id="end-card" data-fd-name="LightTwist end card">
        <div class="end-brand" data-fd-id="end-brand"></div>
        <h2 class="end-title">
          <span data-fd-id="end-line-one"></span>
          <span class="line-two" data-fd-id="end-line-two"></span>
        </h2>
        <div class="end-action">
          <span class="end-cta" data-fd-id="end-cta"></span>
          <span class="end-url" data-fd-id="end-url"></span>
        </div>
      </section>

      <audio data-fd-id="music-bed" data-fd-name="LightTwist music bed" data-fd-type="audio"></audio>
      <section data-fd-clip data-fd-id="reveal-shine" data-fd-name="Transformation shine">
        <audio data-fd-type="audio"></audio>
      </section>

      <script>
        const clamp = (value) => Math.max(0, Math.min(1, value));
        const easeOut = (value) => 1 - Math.pow(1 - clamp(value), 3);
        const easeIn = (value) => Math.pow(clamp(value), 3);
        const local = (element) => Number(element.dataset.fdLocalFrame || 0);
        const duration = (element) => Math.max(1, Number(element.dataset.fdDuration || 1));

        onFrame(({ time }) => {
          const orbA = query(".orb-a");
          const orbB = query(".orb-b");
          orbA.style.transform = `translate(${Math.sin(time * 0.48) * 42}px, ${Math.cos(time * 0.42) * 36}px) scale(${1 + Math.sin(time * 0.31) * 0.05})`;
          orbB.style.transform = `translate(${Math.cos(time * 0.36) * 38}px, ${Math.sin(time * 0.44) * 44}px)`;

          const bad = query(".bad-call");
          const badFrame = local(bad);
          const badDuration = duration(bad);
          const badIn = easeOut(badFrame / 10);
          const badOut = easeIn((badFrame - (badDuration - 12)) / 12);
          bad.style.opacity = String(badIn * (1 - badOut));
          const badCard = bad.querySelector(".video-card");
          badCard.style.transform = `translateY(${(1 - badIn) * 30 - badOut * 16}px) scale(${0.94 + badIn * 0.06 + badFrame / badDuration * 0.018})`;

          const hook = query(".hook-copy");
          const hookFrame = local(hook);
          const hookDuration = duration(hook);
          const hookIn = easeOut(hookFrame / 12);
          const hookOut = easeIn((hookFrame - (hookDuration - 10)) / 10);
          hook.style.opacity = String(hookIn * (1 - hookOut));
          hook.querySelector(".kicker").style.transform = `translateY(${(1 - hookIn) * -18}px)`;
          hook.querySelector(".hook-title").style.transform = `translateY(${(1 - hookIn) * 34 + hookOut * 16}px)`;

          queryAll(".news-shot").forEach((shot, index) => {
            const frame = local(shot);
            const shotDuration = duration(shot);
            const intro = easeOut(frame / 8);
            const outro = easeIn((frame - (shotDuration - 8)) / 8);
            shot.style.opacity = String(intro * (1 - outro));
            const card = shot.querySelector(".video-card");
            const drift = frame / shotDuration;
            card.style.transform = `translateY(${(1 - intro) * 48 + outro * 24}px) scale(${0.94 + intro * 0.06 + drift * 0.012}) rotate(${(1 - intro) * (index % 2 ? 0.7 : -0.7)}deg)`;
          });

          const reveal = query(".reveal-copy");
          const revealFrame = local(reveal);
          const revealDuration = duration(reveal);
          const revealIn = easeOut(revealFrame / 10);
          const revealOut = easeIn((revealFrame - (revealDuration - 10)) / 10);
          reveal.style.opacity = String(revealIn * (1 - revealOut));
          reveal.querySelector(".reveal-title").style.transform = `translateY(${(1 - revealIn) * 42 + revealOut * 20}px) scale(${0.95 + revealIn * 0.05})`;

          const chips = query(".proof-chips");
          const chipFrame = local(chips);
          const chipDuration = duration(chips);
          const chipOut = easeIn((chipFrame - (chipDuration - 10)) / 10);
          chips.querySelectorAll(".proof-chip").forEach((chip, index) => {
            const intro = easeOut((chipFrame - index * 6) / 12);
            chip.style.opacity = String(intro * (1 - chipOut));
            chip.style.transform = `translateY(${(1 - intro) * 26 + chipOut * 14}px)`;
          });

          const flash = query(".transition-flash");
          const flashFrame = local(flash);
          const flashDuration = duration(flash);
          flash.style.opacity = String(Math.sin(Math.PI * clamp(flashFrame / flashDuration)) * 0.86);

          const endVisual = query(".end-visual");
          const endVisualFrame = local(endVisual);
          const endVisualIn = easeOut(endVisualFrame / 12);
          endVisual.style.opacity = String(endVisualIn);
          endVisual.querySelector("canvas").style.transform = `scale(${1.12 - endVisualIn * 0.03 + endVisualFrame / duration(endVisual) * 0.018})`;

          const end = query(".end-card");
          const endFrame = local(end);
          const endIn = easeOut(endFrame / 13);
          end.style.opacity = String(endIn);
          end.querySelector(".end-brand").style.transform = `translateY(${(1 - endIn) * -24}px)`;
          end.querySelector(".end-title").style.transform = `translateY(${(1 - easeOut((endFrame - 4) / 14)) * 42}px)`;
          end.querySelector(".end-action").style.opacity = String(easeOut((endFrame - 14) / 15));
          end.querySelector(".end-action").style.transform = `translateY(${(1 - easeOut((endFrame - 14) / 15)) * 22}px)`;
        });
      </script>
    </main>
  </body>
</html>
