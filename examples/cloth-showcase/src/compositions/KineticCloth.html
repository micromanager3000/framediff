<!doctype html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    [data-fd-composition] {
      --acid: #d9ff43;
      --orange: #ff5b35;
      --paper: #f4f0df;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      color: var(--paper);
      background:
        radial-gradient(circle at calc(13% + var(--orbit-x, 0%)) 22%, rgba(164,255,96,.2), transparent 24%),
        radial-gradient(circle at 84% 74%, rgba(255,91,53,.17), transparent 31%),
        linear-gradient(122deg, #0d1612 0%, #060908 54%, #15100e 100%);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: .17;
      background-image:
        linear-gradient(rgba(244,240,223,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(244,240,223,.14) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }
    [data-grid="false"] .grid { display: none; }
    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 504px;
      height: 504px;
      border: 1px solid rgba(217,255,67,.28);
      border-radius: 50%;
      transform: translate(-50%, -48%) scale(var(--halo-scale, .84));
      box-shadow: 0 0 120px rgba(217,255,67,.07), inset 0 0 90px rgba(255,91,53,.05);
    }
    .halo::before, .halo::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(244,240,223,.1);
      border-radius: inherit;
    }
    .halo::before { inset: 52px; }
    .halo::after { inset: 112px; border-style: dashed; }
    .shadow {
      position: absolute;
      left: 50%;
      bottom: 39px;
      width: 870px;
      height: 82px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,.72);
      filter: blur(23px);
    }
    #fd-cloth-input {
      position: absolute;
      overflow: hidden;
      box-shadow: 0 32px 90px rgba(0,0,0,.5);
    }
    .cloth-canvas { position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; }
    .interface { position: absolute; z-index: 4; inset: 0; pointer-events: none; }
    .top {
      position: absolute;
      left: 30px;
      right: 30px;
      top: 24px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(244,240,223,.7);
    }
    .brand { color: var(--acid); }
    .live { display: inline-flex; align-items: center; gap: 9px; justify-self: center; }
    .live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 16px var(--orange);
      opacity: var(--pulse, .7);
    }
    .inspiration {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      color: rgba(244,240,223,.82);
      text-decoration: none;
      letter-spacing: .1em;
      border: 1px solid rgba(244,240,223,.18);
      border-radius: 999px;
      background: rgba(6,9,8,.44);
      pointer-events: auto;
    }
    .inspiration:hover { color: #fff; background: rgba(244,240,223,.1); }
    .bottom {
      position: absolute;
      left: 30px;
      right: 30px;
      bottom: 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      color: rgba(244,240,223,.58);
      font: 700 10px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .bottom .center { color: var(--paper); text-align: center; font-size: 12px; }
    .bottom .right { text-align: right; }
    .pipeline {
      position: absolute;
      left: 50%;
      top: 72px;
      display: flex;
      gap: 7px;
      transform: translateX(-50%);
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .pipeline span {
      padding: 6px 9px;
      color: rgba(244,240,223,.62);
      border: 1px solid rgba(244,240,223,.13);
      border-radius: 999px;
      background: rgba(6,9,8,.38);
    }
    .pipeline b { display: grid; place-items: center; color: rgba(217,255,67,.5); }
    .runtime-error {
      display: none;
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 50%;
      max-width: 520px;
      padding: 14px 16px;
      transform: translate(-50%, -50%);
      color: #ffd9cb;
      border: 1px solid rgba(255,186,160,.34);
      border-radius: 10px;
      background: rgba(26,12,9,.92);
      box-shadow: 0 18px 60px rgba(0,0,0,.5);
      font: 600 13px/1.4 Inter, system-ui, sans-serif;
    }
    [data-fd-error] .runtime-error { display: block; }
  </style>
</head>
<body>
  <main data-fd-composition data-fd-id="KineticCloth" data-fd-width="1280" data-fd-height="720" data-fd-fps="30" data-fd-duration="240" data-fd-kind="3d" data-fd-source="src/compositions/KineticCloth.html" data-fd-module="src/compositions/KineticCloth.ts" data-fd-export="kineticClothComposition" data-fd-document="src/compositions/KineticCloth.comp.json" data-fd-schema="src/compositions/KineticCloth.schema.json">
    <div class="grid"></div>
    <div class="halo"></div>
    <div class="shadow"></div>
    <section id="fd-cloth-input" data-fd-id="composition-input" data-fd-type="nested" data-fd-comp="material-poster" data-fd-layout-space="composition" data-fd-x="168" data-fd-y="80" data-fd-width="944" data-fd-height="560" data-fd-fit="fill" aria-hidden="true"></section>
    <canvas class="cloth-canvas" data-fd-id="cloth-surface" data-fd-cloth data-fd-cloth-source="#fd-cloth-input" data-fd-cloth-refresh="frame" aria-label="Material Poster composition rendered as animated holographic cloth"></canvas>
    <div class="runtime-error" role="alert"></div>

    <div class="interface" data-fd-id="interface-overlay">
      <div class="top">
        <span class="brand">FrameDiff / Material Lab</span>
        <span class="live">Composition mapped live</span>
        <a class="inspiration" href="https://holocloth.vercel.app" target="_blank" rel="noreferrer" aria-label="Open HoloCloth, the inspiration for this material study">Inspired by HoloCloth <span>↗</span></a>
      </div>
      <div class="pipeline"><span>Input comp</span><b>→</b><span>Frame texture</span><b>→</b><span>Physical surface</span></div>
      <div class="bottom">
        <span>Nested comp → canvas texture<br>One synchronized frame clock</span>
        <span class="center"><span class="phase">01 / FORM</span><br><span class="time">00:00:00</span></span>
        <span class="right">Iridescence / wind / collision<br>Exact capture enabled</span>
      </div>
    </div>

    <script>
      const phaseLabels = [
        { until: 54, label: "01 / FORM" },
        { until: 112, label: "02 / FORCE" },
        { until: 178, label: "03 / FOLD" },
        { until: 240, label: "04 / FLOW" },
      ];
      onFrame(({ frame, durationInFrames, fps }) => {
        const wholeFrame = Math.max(0, Math.min(durationInFrames - 1, Math.round(frame)));
        const progress = wholeFrame / (durationInFrames - 1);
        const phase = phaseLabels.find((item) => wholeFrame < item.until) || phaseLabels[phaseLabels.length - 1];
        const seconds = Math.floor(wholeFrame / fps);
        const frames = wholeFrame % fps;
        const root = query(".interface").parentElement;
        root.style.setProperty("--orbit-x", `${Math.sin(progress * Math.PI * 2) * 7}%`);
        root.style.setProperty("--halo-scale", String(.84 + Math.sin(progress * Math.PI * 4) * .04));
        root.style.setProperty("--pulse", String(.45 + Math.sin(frame * .22) * .35));
        query(".phase").textContent = phase.label;
        query(".time").textContent = `00:${String(seconds).padStart(2, "0")}:${String(frames).padStart(2, "0")}`;
      });
    </script>
  </main>
</body>
</html>
