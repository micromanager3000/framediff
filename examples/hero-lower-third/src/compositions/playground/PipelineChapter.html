<!doctype html>
<html><head><style>
  main[data-fd-id="PipelineChapter"]{position:relative;overflow:hidden;background:#080b13;color:#f5f2ff;font-family:Inter,"SF Pro Display",system-ui,sans-serif}main[data-fd-id="PipelineChapter"]>[data-fd-clip][data-fd-comp]{position:absolute;inset:0;overflow:hidden}main[data-fd-id="PipelineChapter"]>.play-chapter-hud{position:absolute;inset:0;z-index:30;pointer-events:none}main[data-fd-id="PipelineChapter"] .play-chapter-label{position:absolute;left:42px;top:38px;padding:11px 15px;border:1px solid rgb(255 255 255/.16);border-radius:999px;background:rgb(7 9 16/.76);font:900 12px/1 ui-monospace,monospace;letter-spacing:.11em}main[data-fd-id="PipelineChapter"] .play-chapter-label b{color:#65d4c1}main[data-fd-id="PipelineChapter"] .play-chapter-nav{position:absolute;left:42px;right:42px;bottom:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}main[data-fd-id="PipelineChapter"] .play-chapter-nav i{height:5px;border-radius:99px;background:rgb(255 255 255/.15)}main[data-fd-id="PipelineChapter"] .play-chapter-nav i.active{background:linear-gradient(90deg,#5dd3c1,#8e7cff);box-shadow:0 0 18px rgb(93 211 193/.38)}main[data-fd-id="PipelineChapter"] .play-chapter-source{position:absolute;right:42px;top:42px;color:rgb(245 242 255/.64);font:800 11px/1 ui-monospace,monospace;letter-spacing:.09em}
</style></head><body>
  <main data-fd-composition data-fd-id="PipelineChapter" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="480" data-fd-kind="edit" data-fd-source="src/compositions/playground/PipelineChapter.html" data-fd-module="src/compositions/playground/StudioPlayground.ts" data-fd-export="pipelineChapterComp">

  </main>
