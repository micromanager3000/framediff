<!doctype html><html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:#090b12;color:white;font-family:Inter,system-ui,sans-serif}
  .noise{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle at 20% 30%,rgb(255 255 255/.14) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 65%,rgb(124 92 255/.18) 0 1px,transparent 1.5px);background-position:0 0,3px 4px;background-size:7px 7px,9px 9px;mix-blend-mode:screen}
  .kicker{position:absolute;left:110px;top:88px;color:#87a3ff;font:700 22px/1 ui-monospace,monospace;letter-spacing:.18em}.headline{position:absolute;left:104px;top:137px}
  .panel{position:absolute;box-sizing:border-box;border:1px solid rgb(255 255 255/.17);box-shadow:0 32px 90px rgb(0 0 0/.35)}
  .gradient-panel{left:106px;top:388px}.gradient-label{position:absolute;left:32px;bottom:27px;color:white;font:800 18px/1 ui-monospace,monospace;letter-spacing:.12em}
  .flex-panel{left:760px;top:388px}.flex-panel span{display:grid;place-items:center;width:104px;height:104px;border-radius:22px;background:rgb(255 255 255/.13);font:800 17px/1 ui-monospace,monospace}.flex-panel span:nth-child(2){background:#ee6aaf}.flex-panel span:nth-child(3){background:#7c5cff}
  .asset-panel{left:1396px;top:388px;display:grid;place-items:center;background:linear-gradient(145deg,#151927,#0c0e16);color:#8e94a8;text-align:center}.asset-panel strong{display:block;color:white;font-size:25px}.asset-panel code{display:block;margin-top:12px;color:#a9bbff;font-size:17px}
  .caption{position:absolute;left:110px;bottom:70px;color:#9ca2b6;font:500 20px/1.5 ui-monospace,monospace}.caption b{color:#eea7d0}
</style></head><body>
<main data-fd-composition data-fd-id="RichPropertiesLab" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="180" data-fd-kind="edit" data-fd-library="true" data-fd-source="src/compositions/labs/RichPropertiesLab.html" data-fd-module="src/compositions/StaticCompositions.ts" data-fd-export="richPropertiesLabComp">
  <div class="noise"></div>
  <section data-fd-clip data-fd-id="rich-scene" data-fd-name="Rich property controls" data-fd-from="0" data-fd-duration="180">
    <div class="kicker" data-fd-id="rich-kicker" data-fd-text="FRAME-NATIVE · SOURCE-NATIVE" data-fd-color="#87a3ff" data-fd-font-family="Courier New" data-fd-font-weight="700" data-fd-font-style="normal" data-fd-font-size="22" data-fd-line-height="1" data-fd-letter-spacing="3" data-fd-text-align="left" data-fd-text-decoration="none" data-fd-text-transform="uppercase"></div>
    <h1 class="headline" data-fd-id="rich-headline" data-fd-text="Every visual choice stays connected." data-fd-x="0" data-fd-y="0" data-fd-width="1500" data-fd-height="180" data-fd-color="#f8f4ff" data-fd-font-family="Inter, system-ui, sans-serif" data-fd-font-weight="800" data-fd-font-style="normal" data-fd-font-size="78" data-fd-line-height="0.98" data-fd-letter-spacing="-3" data-fd-text-align="left" data-fd-text-decoration="none" data-fd-text-transform="none" data-fd-opacity="1"></h1>
    <article class="panel gradient-panel" data-fd-id="gradient-panel" data-fd-name="Gradient panel" data-fd-x="0" data-fd-y="0" data-fd-width="560" data-fd-height="390" data-fd-fill="linear-gradient" data-fd-fill-color="#7c5cff" data-fd-gradient-angle="-84" data-fd-gradient-stops="#4729dd@0|#d747a5@0.58|#ffb45e@1" data-fd-opacity="0.96" data-fd-border-radius="38" data-fd-blend-mode="screen" data-fd-isolation="true"><span class="gradient-label" data-fd-id="gradient-label" data-fd-text="GRADIENT + BLEND"></span></article>
    <article class="panel flex-panel" data-fd-id="flex-panel" data-fd-name="Flex panel" data-fd-x="0" data-fd-y="0" data-fd-width="536" data-fd-height="390" data-fd-fill="solid" data-fd-fill-color="#171b2a" data-fd-layout="flex" data-fd-flex-direction="row" data-fd-flex-wrap="wrap" data-fd-justify="space-between" data-fd-align-items="center" data-fd-align-content="center" data-fd-gap="18" data-fd-padding="42 36 42 36" data-fd-border-radius="38" data-fd-opacity="1" data-fd-blend-mode="normal" data-fd-isolation="true"><span data-fd-id="flex-text" data-fd-text="TEXT"></span><span data-fd-id="flex-fill" data-fd-text="FILL"></span><span data-fd-id="flex-layout" data-fd-text="FLEX"></span></article>
    <article class="panel asset-panel" data-fd-id="asset-panel" data-fd-name="Asset fill panel" data-fd-x="0" data-fd-y="0" data-fd-width="414" data-fd-height="390" data-fd-fill="image" data-fd-image="" data-fd-fit="cover" data-fd-image-position="center" data-fd-border-radius="38" data-fd-opacity="1" data-fd-blend-mode="normal" data-fd-isolation="true"><div><strong data-fd-id="asset-title" data-fd-text="Choose an image"></strong><code data-fd-id="asset-caption" data-fd-text="asset:// stays portable"></code></div></article>
    <div class="caption" data-fd-id="rich-caption" data-fd-text="Double-click text on canvas to edit it directly · every control writes source · preview and render share the same runtime" data-fd-color="#9ca2b6" data-fd-font-family="Courier New" data-fd-font-weight="500" data-fd-font-size="20" data-fd-line-height="1.5" data-fd-letter-spacing="0" data-fd-text-align="left"></div>
  </section>
  <script>onFrame(({frame})=>{const panel=query('[data-fd-id="gradient-panel"]');panel.style.filter=`hue-rotate(${Math.sin(frame/45)*5}deg)`;})</script>
</main></body></html>
