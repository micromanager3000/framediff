<!doctype html><html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:#05060a;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  [data-fd-clip]{position:absolute;inset:0}
  .shot canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .caption{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:128px;box-sizing:border-box;pointer-events:none;text-align:center;font-weight:800;font-size:68px;line-height:1.12;text-shadow:0 3px 24px rgba(0,0,0,.7)}
  .lower{display:flex;align-items:flex-end;justify-content:center;padding-bottom:92px;box-sizing:border-box}.lower-box{padding:28px 42px 24px;border-radius:18px;background:rgba(7,10,18,.75);backdrop-filter:blur(16px);font-size:38px}.brand{font-weight:800}.underline{height:5px;margin-top:17px;transform-origin:left;background:linear-gradient(90deg,#a29bfe,#6c5ce7,#fd79a8)}
  .bumper,.closing,.endcard{display:grid;place-items:center}.bumper{background:radial-gradient(900px 560px at 42% 42%,rgba(40,70,120,.35),transparent 60%),radial-gradient(1000px 640px at 50% 50%,#111d2b,#05060a 74%)}
  .logo{font-size:150px;font-weight:800;background:linear-gradient(100deg,#ff7ab0,#b06bff 26%,#6c5ce7 48%,#4d9fff 74%,#3fe3d2);background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(108,92,231,.45))}
  .closing{background:radial-gradient(1200px 700px at 50% 50%,#122031,#04060b 75%);font-size:80px;font-weight:500;letter-spacing:1.5px}
  .endcard{background:#05060a;overflow:hidden}.aurora{position:absolute;inset:-20%;filter:blur(40px)}.cta{position:relative;text-align:center}.cta .line1{font-size:40px}.cta .line2{font-size:104px;font-weight:800;color:#a29bfe}.cta .underline{width:100%;transform-origin:center}
</style></head><body>
<main data-fd-composition data-fd-id="LightTwistReel" data-fd-width="1920" data-fd-height="1080" data-fd-fps="24" data-fd-duration="1092"
 data-fd-kind="edit" data-fd-source="src/compositions/LightTwistReel.html" data-fd-module="src/compositions/LightTwistReel.ts" data-fd-export="lightTwistReelComp" data-fd-timeline-source="src/compositions/LightTwistReel.timeline.json" data-fd-document="src/compositions/LightTwistReel.comp.json" data-fd-schema="src/compositions/LightTwistReel.schema.json">

  <script>
    const clamp=n=>Math.max(0,Math.min(1,n)); const out=n=>1-Math.pow(1-clamp(n),3);
    onFrame(({time})=>{
      queryAll(".caption").forEach(el=>{const f=Number(el.dataset.fdLocalFrame||0),d=Number(el.dataset.fdDuration);const intro=out(f/8),exit=Math.pow(clamp((f-(d-8))/8),3);el.style.opacity=String(intro*(1-exit));el.firstElementChild.style.transform=`translateY(${(1-intro)*16+exit*10}px)`});
      const lowerClip=query(".lower"),lower=query(".lower-box"),lf=Number(lowerClip.dataset.fdLocalFrame||0),ld=Number(lowerClip.dataset.fdDuration||1),li=out(lf/14),lx=Math.pow(clamp((lf-(ld-11))/11),3);lower.style.opacity=String(li*(1-lx));lower.style.transform=`translateY(${(1-li)*-38+lx*26}px)`;lower.querySelector(".underline").style.transform=`scaleX(${out((lf-3)/18)})`;
      [query(".logo"),query(".closing>div")].forEach(el=>{const f=Number(el.parentElement.dataset.fdLocalFrame||0),p=out(f/18);el.style.opacity=String(p);el.style.transform=`translateY(${(1-p)*18}px) scale(${.92+.08*p})`});
      const end=query(".endcard"),ef=Number(end.dataset.fdLocalFrame||0),appear=clamp(ef/18);end.style.opacity=String(appear);end.querySelector(".aurora").style.background=`radial-gradient(42% 42% at ${50+Math.sin(time*.5)*12}% ${42+Math.cos(time*.42)*10}%,#6c5ce7aa,transparent 70%),radial-gradient(46% 46% at ${60+Math.cos(time*.37)*14}% ${60+Math.sin(time*.55)*9}%,#fd79a84d,transparent 72%)`;end.querySelector(".underline").style.transform=`scaleX(${out((ef-22)/20)})`;
    });
  </script>
