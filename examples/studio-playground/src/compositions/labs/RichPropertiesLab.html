<!doctype html><html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:#090b12;color:white;font-family:Inter,system-ui,sans-serif}
  .noise{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle at 20% 30%,rgb(255 255 255/.14) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 65%,rgb(124 92 255/.18) 0 1px,transparent 1.5px);background-position:0 0,3px 4px;background-size:7px 7px,9px 9px;mix-blend-mode:screen}
  .kicker{position:absolute;left:0;top:0}.headline{position:absolute;left:0;top:0}
  .panel{position:absolute;box-sizing:border-box;border:1px solid rgb(255 255 255/.17);box-shadow:0 32px 90px rgb(0 0 0/.35)}
  .gradient-label{position:absolute;left:32px;bottom:27px;color:white;font:800 18px/1 ui-monospace,monospace;letter-spacing:.12em}
  .flex-panel span{display:grid;place-items:center;width:104px;height:104px;border-radius:22px;background:rgb(255 255 255/.13);font:800 17px/1 ui-monospace,monospace}.flex-panel span:nth-child(2){background:#ee6aaf}.flex-panel span:nth-child(3){background:#7c5cff}
  .asset-panel{display:grid;place-items:center;background:linear-gradient(145deg,#151927,#0c0e16);color:#8e94a8;text-align:center}.asset-panel strong{display:block;color:white;font-size:25px}.asset-panel code{display:block;margin-top:12px;color:#a9bbff;font-size:17px}
  .caption{position:absolute;left:0;top:0}.caption b{color:#eea7d0}
</style></head><body>
<main data-fd-composition data-fd-id="RichPropertiesLab" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="180" data-fd-kind="scene" data-fd-library="true" data-fd-source="src/compositions/labs/RichPropertiesLab.html" data-fd-module="src/compositions/StaticCompositions.ts" data-fd-export="richPropertiesLabComp" data-fd-document="src/compositions/labs/RichPropertiesLab.comp.json" data-fd-schema="src/compositions/labs/RichPropertiesLab.schema.json">
  <div class="noise"></div>
  <section data-fd-id="rich-scene" data-fd-name="JSON property canvas">
    <div class="kicker" data-fd-id="rich-kicker"></div>
    <h1 class="headline" data-fd-id="rich-headline"></h1>
    <article class="panel gradient-panel" data-fd-id="gradient-panel" data-fd-name="Gradient panel"><span class="gradient-label" data-fd-id="gradient-label"></span></article>
    <article class="panel flex-panel" data-fd-id="flex-panel" data-fd-name="Flex panel"><span data-fd-id="flex-text"></span><span data-fd-id="flex-fill"></span><span data-fd-id="flex-layout"></span></article>
    <article class="panel asset-panel" data-fd-id="asset-panel" data-fd-name="Asset fill panel"><div><strong data-fd-id="asset-title"></strong><code data-fd-id="asset-caption"></code></div></article>
    <div class="caption" data-fd-id="rich-caption"></div>
  </section>
  <script>onFrame(({frame})=>{const panel=query('[data-fd-id="gradient-panel"]');panel.style.filter=`hue-rotate(${Math.sin(frame/45)*5}deg)`;})</script>
</main></body></html>
