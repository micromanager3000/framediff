<!doctype html><html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:#05070c;color:white;font-family:Inter,system-ui,sans-serif}
  [data-fd-clip]{position:absolute;inset:0;overflow:hidden}.base video{width:100%;height:100%;object-fit:cover;filter:saturate(.75) contrast(1.08)}
  .wash{background:linear-gradient(110deg,rgb(4 6 12/.84),rgb(22 12 35/.18) 55%,rgb(255 85 144/.22));mix-blend-mode:multiply}
  .glass{position:absolute;left:115px;right:115px;bottom:96px;height:250px;border:1px solid rgb(255 255 255/.18);border-radius:34px;background:linear-gradient(110deg,rgb(11 14 25/.88),rgb(35 24 53/.72));box-shadow:0 35px 100px rgb(0 0 0/.48);backdrop-filter:blur(18px)}
  .copy{position:absolute;left:168px;bottom:151px}.copy span{display:block;color:#e591bc;font:700 21px/1 ui-monospace,monospace;letter-spacing:.16em}.copy strong{display:block;margin-top:17px;font-size:64px;letter-spacing:-.045em}.copy p{margin:10px 0 0;color:#b9becd;font-size:23px}
  .rank{position:absolute;right:162px;bottom:154px;display:grid;grid-template-columns:repeat(3,82px);gap:10px}.rank b{display:grid;place-items:center;height:82px;border:1px solid rgb(255 255 255/.14);border-radius:20px;background:rgb(255 255 255/.08);font:800 15px/1 ui-monospace,monospace}.rank b:nth-child(3){background:#d65398}
  .badge{position:absolute;right:108px;top:92px;padding:12px 17px;border-radius:999px;background:rgb(4 6 12/.62);color:#d6d8e2;font:700 17px/1 ui-monospace,monospace;letter-spacing:.08em}
</style></head><body>
<main data-fd-composition data-fd-id="EditorialLab" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="180" data-fd-kind="edit" data-fd-library="true" data-fd-source="src/compositions/labs/EditorialLab.html" data-fd-module="src/compositions/StaticCompositions.ts" data-fd-export="editorialLabComp" data-fd-timeline-source="src/compositions/labs/EditorialLab.timeline.json" data-fd-document="src/compositions/labs/EditorialLab.comp.json" data-fd-schema="src/compositions/labs/EditorialLab.schema.json">
  <section class="base" data-fd-clip data-fd-id="editorial-media"><video data-fd-muted="true" data-fd-fit="cover"></video></section>
  <section class="wash" data-fd-clip data-fd-id="editorial-wash"></section>
  <section data-fd-clip data-fd-id="editorial-glass"><div class="glass" data-fd-id="editorial-glass-panel"></div></section>
  <section data-fd-clip data-fd-id="editorial-copy"><div class="copy"><span data-fd-id="editorial-kicker"></span><strong data-fd-id="editorial-title"></strong><p data-fd-id="editorial-caption"></p></div><div class="rank"><b data-fd-id="editorial-rank-1"></b><b data-fd-id="editorial-rank-2"></b><b data-fd-id="editorial-rank-4"></b></div></section>
  <div class="badge" data-fd-id="editorial-badge"></div>
  <section data-fd-clip data-fd-id="editorial-grade" data-fd-grade-layer></section>
</main></body></html>
