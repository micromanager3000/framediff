<!doctype html><html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:#070913;color:#f6f1ff;font-family:Inter,"SF Pro Display",sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgb(141 105 255/.08) 1px,transparent 1px),linear-gradient(90deg,rgb(141 105 255/.08) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 92%)}
  .orb{position:absolute;border-radius:999px;filter:blur(18px);opacity:.65}.orb.a{left:100px;top:70px;width:460px;height:460px;background:#5e37ff}.orb.b{right:100px;bottom:30px;width:520px;height:520px;background:#e3449e}
  .eyebrow{position:absolute;left:0;top:0;color:#bca8ff;font:700 22px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
  .title{position:absolute;left:0;top:0;font-size:92px;font-weight:850;line-height:.92;letter-spacing:-.055em}.title em{color:#dba8ff;font-style:normal}
  .card{position:absolute;display:flex;flex-direction:column;justify-content:space-between;padding:34px;border:1px solid rgb(255 255 255/.18);border-radius:30px;background:linear-gradient(145deg,rgb(255 255 255/.14),rgb(255 255 255/.045));box-shadow:0 28px 90px rgb(0 0 0/.35);backdrop-filter:blur(18px)}
  .card strong{font-size:38px;letter-spacing:-.035em}.card p{margin:0;color:#c8c3d4;font-size:22px;line-height:1.35}.card code{align-self:flex-start;padding:8px 12px;border-radius:999px;background:rgb(6 8 18/.62);color:#c6b6ff;font-size:18px}
  .hint{position:absolute;left:0;top:0;color:#9d97aa;font:500 20px/1.4 ui-monospace,monospace}.hint b{color:#f1bb61}
</style></head><body>
<main data-fd-composition data-fd-id="DirectManipulationLab" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="180" data-fd-kind="scene" data-fd-library="true" data-fd-source="src/compositions/labs/DirectManipulationLab.html" data-fd-module="src/compositions/StaticCompositions.ts" data-fd-export="directManipulationLabComp" data-fd-document="src/compositions/labs/DirectManipulationLab.comp.json" data-fd-schema="src/compositions/labs/DirectManipulationLab.schema.json">
  <div class="grid"></div><div class="orb a"></div><div class="orb b"></div>
  <section data-fd-id="lab-scene" data-fd-name="Canvas playground">
    <div class="eyebrow" data-fd-id="lab-eyebrow"></div>
    <h1 class="title" data-fd-id="lab-title"><span data-fd-id="lab-title-lead"></span><em data-fd-id="lab-title-accent"></em></h1>
    <article class="card" data-fd-id="move-card" data-fd-name="Move me">
      <code data-fd-id="move-card-label"></code><strong data-fd-id="move-card-title"></strong><p data-fd-id="move-card-copy"></p>
    </article>
    <article class="card" data-fd-id="resize-card" data-fd-name="Resize me">
      <code data-fd-id="resize-card-label"></code><strong data-fd-id="resize-card-title"></strong><p data-fd-id="resize-card-copy"></p>
    </article>
    <article class="card" data-fd-id="settings-card" data-fd-name="JSON-backed card">
      <code data-fd-id="settings-card-label"></code><strong data-fd-id="settings-card-title"></strong><p data-fd-id="settings-card-copy"></p>
    </article>
    <div class="hint" data-fd-id="lab-hint"><b data-fd-id="lab-hint-label"></b> <span data-fd-id="lab-hint-copy"></span></div>
  </section>
  <script>onFrame(({frame})=>{const glow=query(".orb.b");glow.style.opacity=String(.45+.2*Math.sin(frame/24));})</script>
</main></body></html>
