<!doctype html>
<html><head><style>
  [data-fd-composition]{position:relative;overflow:hidden;background:transparent;color:#f4f2ec;font-family:Inter,"SF Pro Display",system-ui,sans-serif}
  .mark{position:absolute;overflow:visible}
  .mark svg{width:100%;height:100%;display:block;fill:none;stroke-linecap:round}
  .mark .ring{stroke:rgba(244,242,236,.24);stroke-width:2}
  .mark .sweep{stroke:#f0b45f;stroke-width:4}
  .mark .blade{fill:#f0b45f}
  .copy{position:absolute;margin:0;white-space:pre-line}
  .kicker{font-family:ui-monospace,"SFMono-Regular",monospace;font-weight:700}
  .title{font-weight:700}
  .lede{font-weight:420}
  /* The wipe is a clip-path on a wrapper so the glyphs themselves are never scaled or blurred —
     type that animates by transform reads soft at 1080p. */
  .wipe{position:absolute;overflow:hidden}
  .rule{position:absolute;height:2px;background:linear-gradient(90deg,#f0b45f,rgba(240,180,95,0));transform-origin:left center}
</style></head><body>
<main data-fd-composition data-fd-id="Aperture" data-fd-name="Aperture title" data-fd-width="1920" data-fd-height="1080" data-fd-fps="30" data-fd-duration="150" data-fd-kind="scene" data-fd-library="true" data-fd-alpha="true" data-fd-source="src/compositions/Aperture.html" data-fd-module="src/compositions/Aperture.ts" data-fd-export="apertureComp" data-fd-document="src/compositions/Aperture.comp.json" data-fd-schema="src/compositions/Aperture.schema.json">
  <div class="mark" data-fd-id="aperture-mark">
    <svg viewBox="0 0 64 64">
      <circle class="ring" cx="32" cy="32" r="27" pathLength="100" />
      <path class="blade" d="M32 5 A27 27 0 0 1 59 32 L32 32 Z" />
      <path class="sweep" d="M5 32 A27 27 0 0 0 32 59" pathLength="100" />
    </svg>
  </div>
  <p class="copy kicker" data-fd-id="aperture-kicker"></p>
  <div class="wipe" data-fd-id="aperture-title-wipe">
    <h1 class="copy title" data-fd-id="aperture-title"></h1>
  </div>
  <div class="rule" data-fd-id="aperture-rule"></div>
  <p class="copy lede" data-fd-id="aperture-lede"></p>
  <script>
    const easeOut = (v) => 1 - Math.pow(1 - Math.min(1, Math.max(0, v)), 3);

    const ring = query(".ring");
    const sweep = query(".sweep");
    const blade = query(".blade");

    onFrame(({ frame, durationInFrames }) => {
      // Everything is expressed against the composition's own duration, so retiming the clip in
      // the timeline restages the whole sequence instead of clipping the end off it.
      const beat = (start, length) => easeOut((frame - start) / length);
      const out = easeOut((durationInFrames - frame) / 14);

      // 1. The mark traces itself: ring first, then the sweep chasing it.
      if (ring) ring.style.strokeDasharray = (100 * beat(0, 34)).toFixed(2) + " 100";
      if (sweep) sweep.style.strokeDasharray = (100 * beat(12, 30)).toFixed(2) + " 100";
      // 2. The blade irises open behind them.
      if (blade) {
        const iris = beat(20, 26);
        blade.style.opacity = iris.toFixed(3);
        blade.style.transformOrigin = "32px 32px";
        blade.style.transform = "rotate(" + (-110 * (1 - iris)).toFixed(2) + "deg) scale(" + (0.6 + 0.4 * iris).toFixed(3) + ")";
      }

      const mark = query('[data-fd-id="aperture-mark"]');
      if (mark) mark.style.opacity = Math.min(beat(0, 12), out).toFixed(3);

      const kicker = query('[data-fd-id="aperture-kicker"]');
      if (kicker) kicker.style.opacity = Math.min(beat(30, 18), out).toFixed(3);

      // 3. The title is revealed by a wipe rather than a fade — it reads as film titling, and it
      //    keeps every glyph at full opacity and full resolution the whole time.
      const wipe = query('[data-fd-id="aperture-title-wipe"]');
      if (wipe) {
        const reveal = beat(42, 30);
        wipe.style.clipPath = "inset(0 " + (100 - 100 * reveal).toFixed(2) + "% 0 0)";
        wipe.style.opacity = out.toFixed(3);
      }

      // `scale`, not `transform` — the JSON binding owns `transform` to place bound elements, so
      // writing to it here would fight the document for control of the layout.
      const rule = query('[data-fd-id="aperture-rule"]');
      if (rule) rule.style.scale = Math.min(beat(62, 34), out).toFixed(3) + " 1";

      const lede = query('[data-fd-id="aperture-lede"]');
      if (lede) {
        const show = Math.min(beat(74, 26), out);
        lede.style.opacity = show.toFixed(3);
        lede.style.translate = "0 " + (14 * (1 - show)).toFixed(2) + "px";
      }
    });
  </script>
</main></body></html>
