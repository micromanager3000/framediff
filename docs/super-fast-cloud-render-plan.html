&lt;main id=&quot;fd-cloud-render-plan&quot; aria-label=&quot;FrameDiff cloud render implementation plan&quot;&gt;

        &lt;p class=&quot;plan-lede&quot;&gt;
          The fastest path is a content-addressed, warm-capable pool of pinned Chrome workers that

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;architecture-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;

    &lt;/div&gt;
    &lt;div class=&quot;plan-pipeline&quot; role=&quot;img&quot; aria-label=&quot;Studio submits a render to the existing Rust API. The API checks the content-addressed cache, creates immutable work, and dispatches shards through Cloud Tasks to Cloud Run L4 workers. Workers upload segments to object storage. A stitcher creates the final output and the Studio receives progress events.&quot;&gt;
      &lt;div class=&quot;plan-node&quot; data-kind=&quot;existing&quot;&gt;
        &lt;strong&gt;Hosted Studio&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Composition + output profile&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;plan-node&quot; data-kind=&quot;existing&quot;&gt;
        &lt;strong&gt;Rust API on Render&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Auth · fingerprint · job state · events&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;

        &lt;strong&gt;Cloud Tasks → Cloud Run L4&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;8 vCPU · 32 GiB · one isolated shard per request&lt;/span&gt;

      &lt;span class=&quot;plan-legend-item&quot;&gt;&lt;span class=&quot;plan-swatch&quot; data-kind=&quot;storage&quot;&gt;&lt;/span&gt;durable state and bytes&lt;/span&gt;

      &lt;span class=&quot;plan-legend-item&quot;&gt;&lt;span class=&quot;plan-swatch&quot; data-kind=&quot;result&quot;&gt;&lt;/span&gt;final artifact&lt;/span&gt;

    &lt;div class=&quot;plan-note text-small&quot;&gt;

      starts GPU instances in roughly five seconds, and lets the API fan out private HTTP tasks.

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;latency-heading&quot;&gt;

    &lt;div class=&quot;plan-budget&quot; role=&quot;img&quot; aria-label=&quot;Warm latency budget: authenticate and fingerprint under 150 milliseconds, dispatch under 500 milliseconds, fetch hot inputs under one second, parallel raster and encode under five seconds, stitch and publish under two seconds.&quot;&gt;
      &lt;div class=&quot;plan-budget-step&quot;&gt;
        &lt;span&gt;Auth + fingerprint&lt;/span&gt;

      &lt;/div&gt;
      &lt;div class=&quot;plan-budget-step&quot;&gt;

      &lt;div class=&quot;plan-budget-step&quot; data-emphasis=&quot;true&quot;&gt;
        &lt;span&gt;Parallel raster + encode&lt;/span&gt;

      &lt;div class=&quot;plan-budget-step&quot;&gt;
        &lt;span&gt;Stitch + publish&lt;/span&gt;
        &lt;strong class=&quot;plan-budget-time&quot;&gt;≤ 2 s&lt;/strong&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm plan-wide-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;Current exporter behavior&lt;/th&gt;
            &lt;th&gt;Why it is slow in cloud&lt;/th&gt;
            &lt;th&gt;Planned change&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;Clones and rasterizes the full DOM through SVG for every frame&lt;/td&gt;
            &lt;td&gt;Dominant CPU cost; a faster GPU does not remove it&lt;/td&gt;
            &lt;td&gt;Parallelize independent frame ranges first; optimize rasterization only after traces prove the hot calls&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;One browser page renders frames sequentially&lt;/td&gt;
            &lt;td&gt;No frame-range parallelism&lt;/td&gt;
            &lt;td&gt;Run 4–12 idempotent shards, each starting with a keyframe&lt;/td&gt;

            &lt;td&gt;Duplicate work and AAC boundary risk&lt;/td&gt;
            &lt;td&gt;Video-only shards; one deterministic full-range audio job; mux once&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Encoder queue permits only a small amount of overlap&lt;/td&gt;
            &lt;td&gt;Raster and encode overlap, but only inside one process&lt;/td&gt;
            &lt;td&gt;Keep local overlap and add horizontal worker overlap&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;Outputs are not keyed as hosted render results&lt;/td&gt;
            &lt;td&gt;Identical renders pay full cost repeatedly&lt;/td&gt;
            &lt;td&gt;Exact render fingerprint → immutable output hash before dispatch&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;


  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;cost-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;3&lt;/span&gt;
      &lt;h2 id=&quot;cost-heading&quot;&gt;Rough cloud render cost model&lt;/h2&gt;
    &lt;/div&gt;
    &lt;p class=&quot;plan-note text-small&quot;&gt;
      Planning estimate only—not a quote. The renderer has not yet produced Linux L4 benchmark data,
      so the throughput multipliers below are deliberately broad. Prices are USD list price in
      us-central1, checked July 23, 2026, before free tiers or committed-use discounts.
    &lt;/p&gt;
    &lt;div class=&quot;plan-cost-metrics&quot; aria-label=&quot;Cloud render unit economics&quot;&gt;
      &lt;div class=&quot;plan-cost-metric&quot;&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;L4 worker list rate&lt;/span&gt;
        &lt;strong class=&quot;plan-cost-number&quot;&gt;$0.0003947 / sec&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;8 vCPU + 32 GiB + one non-redundant L4&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-cost-metric&quot;&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Fully utilized&lt;/span&gt;
        &lt;strong class=&quot;plan-cost-number&quot;&gt;$1.42 / worker-hour&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Parallelism reduces latency, not total work&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-cost-metric&quot;&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;One new worker minimum&lt;/span&gt;
        &lt;strong class=&quot;plan-cost-number&quot;&gt;$0.0237&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;One-minute minimum instance lifecycle&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-cost-metric plan-cost-warning&quot;&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;One always-warm worker&lt;/span&gt;
        &lt;strong class=&quot;plan-cost-number&quot;&gt;≈ $1,037 / month&lt;/strong&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;730 hours; keep min instances at zero for beta&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-cost-formula text-small&quot;&gt;
      &lt;strong&gt;Model&lt;/strong&gt;
      &lt;code&gt;warm compute cost = output seconds × assumed L4-seconds per output second × $0.0003947&lt;/code&gt;
      &lt;span class=&quot;text-muted&quot;&gt;
        Assumes 30 fps H.264, assets in-region, one isolated shard per worker, no retries, and no
        cache hit. At 60 fps, use roughly 2× the render-work estimate until measurements say otherwise.
      &lt;/span&gt;
    &lt;/div&gt;

    &lt;p class=&quot;text-small text-muted&quot;&gt;
      These are useful-work estimates for a busy pool. They do not include the lifecycle floor or

      means a typical marketing composition with video overlays; “heavy” means decode-heavy,

    &lt;div class=&quot;plan-subsection&quot;&gt;

    &lt;div class=&quot;plan-shard-visual&quot; role=&quot;img&quot; aria-label=&quot;A 900 frame, 30 second render is divided into twelve balanced ranges of 75 frames. Each shard should take about one to three seconds when warm.&quot;&gt;
      &lt;div class=&quot;plan-shard-bar&quot;&gt;&lt;div class=&quot;plan-shard-fill&quot;&gt;&lt;/div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;0&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;plan-shard-bar&quot;&gt;&lt;div class=&quot;plan-shard-fill&quot;&gt;&lt;/div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;750&lt;/span&gt;&lt;/div&gt;

    &lt;/div&gt;
    &lt;div class=&quot;viz-grid&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;strong&gt;First-render policy&lt;/strong&gt;
        &lt;p class=&quot;text-small text-muted&quot;&gt;Use equal ranges and cap parallelism at 12, the customer plan limit, and available GPU quota.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;strong&gt;Adaptive policy&lt;/strong&gt;
        &lt;p class=&quot;text-small text-muted&quot;&gt;Persist milliseconds per frame by composition class; size future shards for 1–3 seconds of compute.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;strong&gt;Retry policy&lt;/strong&gt;
        &lt;p class=&quot;text-small text-muted&quot;&gt;Retry only the failed range with the same idempotency key; never restart a healthy render.&lt;/p&gt;

      &lt;span class=&quot;viz-badge&quot;&gt;Codec config hash must match&lt;/span&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;contract-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;5&lt;/span&gt;
      &lt;h2 id=&quot;contract-heading&quot;&gt;Make every render immutable and cacheable&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-code&quot; aria-label=&quot;Render fingerprint formula&quot;&gt;
      &lt;code&gt;render_fingerprint = BLAKE3(canonical_json({&lt;/code&gt;
      &lt;code&gt;&amp;nbsp;source_bundle_hash, composition_id, engine_revision, chromium_build,&lt;/code&gt;
      &lt;code&gt;&amp;nbsp;font_pack_hash, ordered_asset_hashes, output_profile, content_domain&lt;/code&gt;
      &lt;code&gt;}))&lt;/code&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm plan-wide-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;Contract&lt;/th&gt;
            &lt;th&gt;Required fields&lt;/th&gt;
            &lt;th&gt;Reason&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RenderManifestV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Fingerprint, bundle hash, composition, rational fps, dimensions, frame/content ranges, codec, bitrate, color profile&lt;/td&gt;
            &lt;td&gt;The worker receives a complete, replayable recipe&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RenderShardV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Job ID, shard index, start/end frame, attempt, deadline, upload grant&lt;/td&gt;
            &lt;td&gt;Tasks are idempotent and individually retryable&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;SegmentReceiptV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Segment hash, bytes, exact frame count, duration, codec-config hash, first/last sample hashes&lt;/td&gt;
            &lt;td&gt;The stitcher rejects gaps, overlaps, and incompatible segments&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RuntimeIdentityV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Worker image digest, engine revision, Chrome version, GPU/encoder identity&lt;/td&gt;
            &lt;td&gt;Hardware-compressed bytes need a runtime-aware cache key and provenance&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-note text-small&quot;&gt;
      A hosted render may start from a Git commit or an ephemeral Studio source bundle. Both paths
      resolve to the same immutable &lt;code&gt;source_bundle_hash&lt;/code&gt;; cloud rendering must never read a
      moving branch head.
    &lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
