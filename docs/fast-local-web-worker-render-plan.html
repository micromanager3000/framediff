    &lt;/div&gt;
    &lt;div class=&quot;plan-pipeline&quot; role=&quot;img&quot; aria-label=&quot;The existing dedicated render window performs a DOM planning pass and exact fallback. Media decode and WebGPU workers send transferable frames into a two-to-four worker OffscreenCanvas render pool. The pool sends completed frames over message channels to one ordered WebCodecs encoder and MP4 mux worker, which streams the final file.&quot;&gt;

        &lt;span class=&quot;text-small text-muted&quot;&gt;Current local isolation and file flow&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;current-cost-heading&quot;&gt;

        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td&gt;Decoded video becomes an HTMLCanvas, then a PNG data URL, then a temporary image&lt;/td&gt;
            &lt;td&gt;GPU/decoder → CPU copy, PNG encode, base64 allocation, image decode, DOM insertion&lt;/td&gt;
            &lt;td&gt;Keep it as a transferable &lt;code&gt;VideoFrame&lt;/code&gt; or &lt;code&gt;ImageBitmap&lt;/code&gt; and composite off-DOM&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td&gt;WebGPU capture becomes a canvas, then a PNG data URL&lt;/td&gt;
            &lt;td&gt;Readback plus lossless encode/decode on every frame&lt;/td&gt;
            &lt;td&gt;Render on an &lt;code&gt;OffscreenCanvas&lt;/code&gt; in a worker and transfer the frame handle&lt;/td&gt;

            &lt;td&gt;Turn it into the planning pass: audio schedule plus compact visual state and change detection&lt;/td&gt;

          &lt;tr&gt;
            &lt;td&gt;The encoder worker waits for one fully rasterized frame at a time&lt;/td&gt;
            &lt;td&gt;Only encode overlaps; frame production remains serial&lt;/td&gt;
            &lt;td&gt;Allow 2–4 workers to produce frames out of order and reorder at the encoder boundary&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;coverage-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;4&lt;/span&gt;
      &lt;h2 id=&quot;coverage-heading&quot;&gt;Use three execution tiers so compatibility never blocks speed&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-tier&quot; data-kind=&quot;fast&quot;&gt;
      &lt;strong&gt;Tier A · worker-native&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;Expected majority of frames&lt;/span&gt;
      &lt;span&gt;
        Pre-rasterized HTML/CSS tiles whose animation is transform, opacity, clip, visibility, or
        placement; images; decoded video; built-in Canvas/WebGPU effects; named grades and LUTs.
      &lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-tier&quot; data-kind=&quot;hybrid&quot;&gt;
      &lt;strong&gt;Tier B · hybrid tile&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;Main thread produces only changed appearance&lt;/span&gt;
      &lt;span&gt;
        Text/content/style variants, occasional layout changes, or custom canvas capture become a
        new raster tile only when their visual revision changes; the worker still places and
        composites that tile across frames.
      &lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-tier&quot; data-kind=&quot;exact&quot;&gt;
      &lt;strong&gt;Tier C · exact DOM fallback&lt;/strong&gt;
      &lt;span class=&quot;text-small text-muted&quot;&gt;Correctness-first escape hatch&lt;/span&gt;
      &lt;span&gt;
        Arbitrary per-frame DOM layout, unsupported CSS, cross-layer &lt;code&gt;backdrop-filter&lt;/code&gt;,
        layout-reading scripts, and unclassified custom renderers use today’s full
        &lt;code&gt;toCanvas()&lt;/code&gt; path for the affected layer or frame.
      &lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-inline-list text-small&quot;&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Show worker coverage in RenderControl&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Explain fallback reason by layer&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Never silently change pixels&lt;/span&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;planning-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;5&lt;/span&gt;
      &lt;h2 id=&quot;planning-heading&quot;&gt;Turn the existing audio scan into a reusable frame plan&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-flow&quot; role=&quot;img&quot; aria-label=&quot;The planner walks frames sequentially once, records authored state changes, classifies layers, rasterizes unique visual variants, and emits an immutable render plan consumed in parallel by workers.&quot;&gt;
      &lt;div class=&quot;plan-flow-step&quot;&gt;
        &lt;span&gt;1 · Walk timeline&lt;/span&gt;
        &lt;strong&gt;&lt;code&gt;renderSync(n)&lt;/code&gt;&lt;/strong&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-flow-step&quot;&gt;
        &lt;span&gt;2 · Observe changes&lt;/span&gt;
        &lt;strong&gt;state + style + content revision&lt;/strong&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-flow-step&quot;&gt;
        &lt;span&gt;3 · Classify layers&lt;/span&gt;
        &lt;strong&gt;native · hybrid · fallback&lt;/strong&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-flow-step&quot; data-kind=&quot;worker&quot;&gt;
        &lt;span&gt;4 · Rasterize variants&lt;/span&gt;
        &lt;strong&gt;once per visual revision&lt;/strong&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-flow-step&quot; data-kind=&quot;worker&quot;&gt;
        &lt;span&gt;5 · Emit plan&lt;/span&gt;
        &lt;strong&gt;pure frame packets&lt;/strong&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm plan-wide-table&quot;&gt;
        &lt;thead&gt;
          &lt;tr&gt;
            &lt;th&gt;Contract&lt;/th&gt;
            &lt;th&gt;Required content&lt;/th&gt;
            &lt;th&gt;Ownership&lt;/th&gt;
          &lt;/tr&gt;
        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RenderPlanV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Dimensions, rational fps, content domain, output profile, ordered frame states, layer capabilities, audio schedule&lt;/td&gt;
            &lt;td&gt;DOM planner creates; coordinator freezes&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RasterTileV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Layer/revision ID, bounds, scale, color space, clip semantics, bitmap/blob handle&lt;/td&gt;
            &lt;td&gt;Main thread rasterizes unique CSS appearance; workers cache locally&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;MediaFrameV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Frame number, source hash, media time, crop/fit, transferable &lt;code&gt;VideoFrame&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Media worker decodes and transfers to one consumer&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;FramePacketV1&lt;/code&gt;&lt;/td&gt;
            &lt;td&gt;Frame number, tile revisions, transforms, opacity, clips, media/GPU handles, fallback handles&lt;/td&gt;
            &lt;td&gt;Coordinator dispatches; render worker consumes&lt;/td&gt;
          &lt;/tr&gt;
          &lt;tr&gt;
            &lt;td class=&quot;text-nowrap&quot;&gt;&lt;code&gt;RenderedFrameV1&lt;/code&gt;&lt;/td&gt;

          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-note text-small&quot;&gt;

        &lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;

            &lt;td&gt;Exact source-frame tests match the current &lt;code&gt;CanvasSink&lt;/code&gt; selection&lt;/td&gt;

          &lt;tr&gt;

            &lt;td&gt;Render worker pool&lt;/td&gt;
            &lt;td&gt;Two-to-four module workers with persistent OffscreenCanvas/WebGPU resources, asset/tile caches, frame queues, and direct encoder ports.&lt;/td&gt;

        &lt;div&gt;
          &lt;strong&gt;Memory&lt;/strong&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;No unbounded queues; all transferable frames close promptly; 4K peak stays under the measured device budget.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card plan-gate&quot;&gt;
        &lt;span class=&quot;plan-gate-mark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;
        &lt;div&gt;
          &lt;strong&gt;Responsiveness&lt;/strong&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;The Studio remains usable and render-window long tasks stay below the agreed threshold outside the explicit planning/fallback lane.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card plan-gate&quot;&gt;
        &lt;span class=&quot;plan-gate-mark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;
        &lt;div&gt;
          &lt;strong&gt;Compatibility&lt;/strong&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Feature detection falls back cleanly when worker WebGPU, WebCodecs transfer, or OffscreenCanvas is unavailable.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card plan-gate&quot;&gt;
        &lt;span class=&quot;plan-gate-mark&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;
        &lt;div&gt;
          &lt;strong&gt;Observability&lt;/strong&gt;
          &lt;p class=&quot;text-small text-muted&quot;&gt;Every frame reports tier, fallback reason, decode/raster/composite/encode duration, queue wait, and worker identity.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;risks-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;9&lt;/span&gt;
      &lt;h2 id=&quot;risks-heading&quot;&gt;Risks and containment&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-risks&quot;&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;DOM fidelity drift&lt;/strong&gt;
        &lt;span&gt;Never approximate an unclassified property. Send that layer/frame through the exact compatibility path and expose the reason in diagnostics.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;4K memory explosion&lt;/strong&gt;
        &lt;span&gt;A single RGBA 4K frame is roughly 33 MB before extra layers. Cap ready frames, reduce the pool to two at 4K, transfer ownership, and close immediately.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;Decoder contention&lt;/strong&gt;
        &lt;span&gt;Use bounded look-ahead and one broker per active source initially; measure before adding parallel decoders that may fight for the same hardware codec.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;GPU contention&lt;/strong&gt;
        &lt;span&gt;Persistent devices and pipelines are required. Prefer one GPU layer worker plus compositor workers before creating many logical GPU devices.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;Out-of-order stall&lt;/strong&gt;
        &lt;span&gt;The encoder reorder buffer has a strict ceiling. Prioritize the earliest missing frame and abort/retry a crashed worker instead of accumulating later frames.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;Stateful scripts&lt;/strong&gt;
        &lt;span&gt;Execute authored code sequentially during planning and record its output. Do not evaluate stateful composition code independently on multiple workers.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;plan-risk&quot;&gt;
        &lt;strong&gt;Header breakage&lt;/strong&gt;
        &lt;span&gt;Do not require &lt;code&gt;SharedArrayBuffer&lt;/code&gt; in the first release. Transferable media handles remove the large copies without forcing COOP/COEP changes on projects.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;tickets-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;10&lt;/span&gt;
      &lt;h2 id=&quot;tickets-heading&quot;&gt;The first ten implementation tickets&lt;/h2&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;plan-checklist&quot;&gt;
      &lt;li&gt;Add phase and per-frame spans around every current export cost, including PNG/base64 encode and image settle time.&lt;/li&gt;
      &lt;li&gt;Create a benchmark command and JSON result format for the five representative compositions at 1080p and 4K.&lt;/li&gt;
      &lt;li&gt;Add feature probes for worker WebCodecs, transferable &lt;code&gt;VideoFrame&lt;/code&gt;, OffscreenCanvas, worker WebGPU, and codec support.&lt;/li&gt;
      &lt;li&gt;Implement a worker-safe media source that returns transferable exact frames without HTMLCanvas or data URLs.&lt;/li&gt;
      &lt;li&gt;Refactor final compositing so media/GPU layers can arrive as handles rather than temporary DOM images.&lt;/li&gt;
      &lt;li&gt;Define and golden-test &lt;code&gt;RenderPlanV1&lt;/code&gt;, &lt;code&gt;RasterTileV1&lt;/code&gt;, &lt;code&gt;FramePacketV1&lt;/code&gt;, and &lt;code&gt;RenderedFrameV1&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;Extend the existing timeline scan to record compact frame state and stable visual revisions.&lt;/li&gt;
      &lt;li&gt;Implement one OffscreenCanvas render worker and direct &lt;code&gt;MessageChannel&lt;/code&gt; delivery to the encoder.&lt;/li&gt;
      &lt;li&gt;Generalize to the adaptive worker pool with reorder backpressure, cancellation, crash recovery, and frame-handle cleanup.&lt;/li&gt;
      &lt;li&gt;Add capability coverage and fallback diagnostics to RenderControl; compare fast and compatibility outputs in CI.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;avoid-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;11&lt;/span&gt;
      &lt;h2 id=&quot;avoid-heading&quot;&gt;Do not put these on the first critical path&lt;/h2&gt;
    &lt;/div&gt;
    &lt;div class=&quot;plan-inline-list&quot;&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;A full HTML layout engine in workers&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;One worker per frame&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;SharedArrayBuffer pixel planes&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Multiple encoders by default&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Cross-origin isolation requirement&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Removing the exact DOM fallback&lt;/span&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Parallel stateful user scripts&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;plan-note text-small&quot;&gt;
      Most of the practical win should come from eliminating PNG round-trips, reusing stable DOM
      appearance, moving media/GPU/compositing off the main thread, and keeping a small bounded pool.
    &lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;plan-section&quot; aria-labelledby=&quot;sources-heading&quot;&gt;
    &lt;div class=&quot;plan-section-heading&quot;&gt;
      &lt;span class=&quot;plan-section-number&quot; aria-hidden=&quot;true&quot;&gt;12&lt;/span&gt;
      &lt;h2 id=&quot;sources-heading&quot;&gt;Current platform facts used in the plan&lt;/h2&gt;
    &lt;/div&gt;
    &lt;ol class=&quot;plan-sources text-small&quot;&gt;
      &lt;li&gt;&lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Async_JS/Introducing_workers&quot;&gt;Web Worker execution model&lt;/a&gt; — workers run off the UI thread but cannot access &lt;code&gt;window&lt;/code&gt;, &lt;code&gt;document&lt;/code&gt;, or DOM elements.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://www.w3.org/TR/webcodecs/&quot;&gt;WebCodecs specification&lt;/a&gt; — codecs are exposed in dedicated workers; &lt;code&gt;VideoFrame&lt;/code&gt;/&lt;code&gt;AudioData&lt;/code&gt; are transferable and should be closed promptly.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://developer.mozilla.org/en-US/docs/Web/API/OffscreenCanvas&quot;&gt;OffscreenCanvas&lt;/a&gt; — canvas rendering and &lt;code&gt;ImageBitmap&lt;/code&gt; production are available in workers.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://gpuweb.github.io/gpuweb/&quot;&gt;WebGPU specification&lt;/a&gt; — &lt;code&gt;navigator.gpu&lt;/code&gt; is exposed through both &lt;code&gt;Navigator&lt;/code&gt; and &lt;code&gt;WorkerNavigator&lt;/code&gt;.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://developer.chrome.com/docs/chromium/renderingng-architecture&quot;&gt;Chromium RenderingNG architecture&lt;/a&gt; — document lifecycle remains on the main thread while workers have their own OffscreenCanvas rendering event loops.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://html.spec.whatwg.org/multipage/workers.html&quot;&gt;HTML worker standard&lt;/a&gt; — &lt;code&gt;hardwareConcurrency&lt;/code&gt; is a hint and user agents may expose a lower value.&lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;
&lt;/main&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

&lt;/body&gt;
